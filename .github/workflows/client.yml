# mod-voicechat - CI: Linux end-to-end tests against Murmur (client + bot) + Win32 build of voice.dll
name: client

on:
  push:
    paths: [ 'external/client/**', 'external/module-tests/**', 'src/**', '.github/workflows/client.yml' ]
  pull_request:
    paths: [ 'external/client/**', 'external/module-tests/**', 'src/**', '.github/workflows/client.yml' ]
  workflow_dispatch:

jobs:
  linux-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Murmur
        run: |
          sudo apt-get update
          sudo apt-get install -y mumble-server libboost-dev libssl-dev lua5.1
          sudo systemctl stop mumble-server || true

      - name: Build voicecore + voicecli
        run: |
          cmake -S external/client -B build -DCMAKE_BUILD_TYPE=Release -DVC_BUILD_DLL=OFF
          cmake --build build -j4

      - name: Start test Murmur
        run: |
          mkdir -p /tmp/murmur
          # DE/EN: autobanAttempts=0 - die Tests bauen viele Verbindungen von 127.0.0.1 auf / tests open many connections from 127.0.0.1
          printf 'database=/tmp/murmur/murmur.sqlite\nhost=127.0.0.1\nport=64738\nusers=100\nopusthreshold=0\nautobanAttempts=0\n' > /tmp/murmur/murmur.ini
          mumble-server -ini /tmp/murmur/murmur.ini -supw ci-superuser
          mumble-server -ini /tmp/murmur/murmur.ini -fg > /tmp/murmur/stdout.log 2>&1 &
          sleep 3

      - name: Unit tests (spatial math, mixer)
        working-directory: build
        run: ctest --output-on-failure

      - name: Lua bridge test (Blizzard UI, Lua 5.1 like WoW)
        run: external/client/tests/nativeui_test.sh

      - name: End-to-end test (UDP + TCP tunnel)
        working-directory: build
        run: ../external/client/tests/e2e.sh tools/voicecli/voicecli

      - name: End-to-end positional test (near / far / other map)
        working-directory: build
        run: ../external/client/tests/e2e_positional.sh tools/voicecli/voicecli

      - name: Build module tests (MumbleBot without AzerothCore)
        run: |
          cmake -S external/module-tests -B build-mt -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mt -j4

      - name: Bot end-to-end test (binding, channels, ACL, group whisper)
        working-directory: build-mt
        run: ../external/module-tests/bot_e2e.sh ./bot_test ../build/tools/voicecli/voicecli ci-superuser

  windows-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build voice.dll (Win32)
        run: |
          cmake -S external/client -B build -A Win32 -DVC_BUILD_TESTS=OFF
          cmake --build build --config Release -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: voice-win32
          path: |
            build/voice/Release/voice.dll
            build/tools/voicecli/Release/voicecli.exe
            external/client/voice/voice.ini.example
            external/client/loader/*.ps1
            external/client/loader/*.bat
